<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Muneer Abdulsattar — Full-stack engineer</title>
  <desc id="description">A midnight blue banner with Muneer's name and a layered architectural illustration representing interfaces, application logic, and data. Websites, apps, and AI. Based in Iraq.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101F38"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <linearGradient id="surface" x1="780" y1="80" x2="1050" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#203B64"/>
      <stop offset="1" stop-color="#122640"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#98B5DE" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <path d="M650 0H1200V360H650Z" fill="url(#grid)"/>
    <path d="M680 360 1040 0M880 360 1200 40" stroke="#6586B6" stroke-opacity="0.08"/>
    <rect x="0.5" y="0.5" width="1199" height="359" rx="19.5" stroke="#A5C3F0" stroke-opacity="0.15"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <path d="m60 47-9 9 9 9m27-18 9 9-9 9m-13-23-6 28" stroke="#81C9FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="111" y="62" fill="#A5BBD8" font-size="19" letter-spacing="0.5">Full-stack engineer</text>

      <text x="52" y="151" fill="#F2F7FF" font-size="76" font-weight="700" letter-spacing="-3">Muneer</text>
      <text x="52" y="230" fill="#F2F7FF" font-size="76" font-weight="700" letter-spacing="-3">Abdulsattar<tspan fill="#81C9FF">.</tspan></text>

      <text x="57" y="273" fill="#AAC2E1" font-size="23">Websites, apps &amp; AI.</text>

      <path d="M57 310H80" stroke="#81C9FF" stroke-width="2"/>
      <text x="91" y="316" fill="#D2E4FB" font-size="17">iqmuneer.com</text>
      <text x="252" y="316" fill="#748DAF" font-size="17">Building from Iraq</text>
    </g>

    <!-- The three connected planes represent data, logic, and interface. -->
    <g stroke-linejoin="round">
      <path d="m756 244 170-89 197 98-170 89Z" fill="#0C1D30" stroke="#42638C"/>
      <path d="M756 244v10l197 98 170-89v-10l-170 89Z" fill="#0B1829" stroke="#42638C"/>
      <path d="m788 245 138-72 163 81-137 72Z" stroke="#42638C" stroke-dasharray="4 6"/>
      <path d="m867 249 32-17 63 31-32 17Zm45-24 32-17 63 31-32 17Zm-1 46 32-17 63 31-32 17Z" fill="#243D60" stroke="#668AB9"/>

      <path d="m732 169 170-89 197 98-170 89Z" fill="#132B49" stroke="#618CC6"/>
      <path d="M732 169v10l197 98 170-89v-10l-170 89Z" fill="#0E2038" stroke="#618CC6"/>
      <path d="m822 161-24 13 26 13m177-29 26 13-24 13m-100-42 21 67" stroke="#8FB8F0" stroke-width="4" stroke-linecap="round"/>

      <path d="m708 94 170-89 197 98-170 89Z" fill="url(#surface)" stroke="#98D8FF" stroke-width="1.5"/>
      <path d="M708 94v10l197 98 170-89v-10l-170 89Z" fill="#162E4D" stroke="#98D8FF" stroke-width="1.5"/>
      <path d="m728 104 170-89" stroke="#6FA3D7" stroke-opacity="0.55"/>
      <path d="m731 92 1-.5m8 4 1-.5m8 4 1-.5" stroke="#B2DFFF" stroke-width="4" stroke-linecap="round"/>

      <!-- A small interface, drawn in the perspective of the top plane. -->
      <path d="m771 108 45-24 73 36-45 24Z" fill="#7CC4F3" fill-opacity="0.17" stroke="#7CC4F3" stroke-opacity="0.45"/>
      <path d="m791 108 11-6 30 15-11 6Z" fill="#A9DDFF"/>
      <path d="m865 65 31-16 87 43-31 16Z" fill="#7CC4F3" fill-opacity="0.09"/>
      <path d="m881 82 57 28m-72-20 80 40m-65-32 33 16" stroke="#A9DDFF" stroke-width="3" stroke-linecap="round"/>
      <path d="m872 148 24-13 35 17-24 13Z" fill="#83CEFF"/>

      <path d="M1090 126v85m-5-80 5-5 5 5m-10 75 5 5 5-5" stroke="#7291B9" stroke-linecap="round"/>
      <path d="M1115 219v49m-5-44 5-5 5 5m-10 39 5 5 5-5" stroke="#49688D" stroke-linecap="round"/>
      <circle cx="1173" cy="38" r="3" fill="#81C9FF"/>
      <path d="M1149 38h-34m58 24v34" stroke="#81C9FF" stroke-opacity="0.35"/>
    </g>
  </g>
</svg>
